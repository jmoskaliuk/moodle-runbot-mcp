name: Deploy to Hetzner VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            APP_DIR=/opt/moodle-runbot-mcp

            echo "==> Pull latest code"
            cd $APP_DIR
            git pull origin main

            echo "==> Install dependencies & build"
            npm ci --quiet
            npm run build

            echo "==> Verify build"
            test -f dist/index.js || { echo "Build failed — dist/index.js not found"; exit 1; }

            echo "==> Restart service"
            systemctl restart moodle-runbot
            sleep 3

            echo "==> Health check"
            curl -sf http://localhost:3000/health || { echo "Health check failed"; exit 1; }

            echo "==> Deploy successful"
